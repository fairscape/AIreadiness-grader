[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairscape-wizard"
version = "0.3.0"
description = "Helper module for the FAIRSCAPE RO-Crate wizard Claude Code skill bundle"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=0.0.14",
    "pyyaml",
    "jinja2",
]

[project.scripts]
fairscape-grade = "aireadiness_wizard.grade:main"
fairscape-evidence = "aireadiness_evidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aireadiness_wizard", "src/aireadiness_evidence"]

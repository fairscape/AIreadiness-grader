sensitive_elements:
- description: The dataset encodes health-related information including diagnostic
    categories for voice disorders, neurological and neurodegenerative conditions,
    mood and psychiatric disorders and respiratory diseases, as well as symptom scores
    from questionnaires, which constitute sensitive personal health data.
- description: Demographic variables such as age, sex and country of data collection
    are included in coarsened form, while finer-grained geographic identifiers, direct
    identifiers and many socio-economic and cultural details have been removed during
    de-identification to reduce re-identification risk.
- description: Highly sensitive content including detailed narrative responses, some
    information about household income, traumatic life experiences and granular cultural
    identifiers has been removed entirely from this feature-only dataset; raw voice
    recordings, which are themselves biometric identifiers, are made available only
    under controlled access.
- description: Use of the data is restricted to authorized researchers under a registered-access
    license and associated data use agreement that explicitly forbids attempts at
    re-identification, stigmatizing or discriminatory uses and applications such as
    surveillance or high-stakes individual decision making.

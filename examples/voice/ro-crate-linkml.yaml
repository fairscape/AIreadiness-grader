ethical_reviews:
- description: Ethical Review by Vardit Ravitsky at the Hastings Center for Bioethics
future_use_impacts:
- description: The project aims to create an ethically sourced, diverse voice dataset
    to support research on using voice as an accessible, low-cost biomarker for screening,
    diagnosis and monitoring of a broad range of health conditions, potentially improving
    early detection and care for underserved populations. At the same time, the consortium
    explicitly recognizes the risks associated with voice data, including privacy
    loss, misuse of voice biometrics and algorithmic harms such as discrimination
    in hiring, insurance or surveillance contexts; these risks motivate a governance
    framework with IRB oversight, rigorous de-identification, separation of feature-only
    and raw-audio tiers and usage restrictions encoded in the registered-access license
    and data use agreement. Dataset documentation and ongoing ethics workstreams are
    intended to help downstream users reason about these risks and design responsible
    analyses and models.
id: ark:59853/rocrate-b2ai-voice-3.0.0
imputation_protocols:
- description: The public datasets do not apply global statistical imputation to missing
    fields; instead, missing questionnaire responses, phenotype variables and derived
    features are left as explicit missing values or omitted rows. The data release
    team audited missingness and users can implement study-specific imputation or
    complete-case strategies appropriate to their analyses.
intended_uses:
- description: 'Development, training and fine-tuning of machine-learning models that
    associate voice-derived features with diagnostic categories or symptom severity
    for conditions such as vocal fold pathology, neurological and neurodegenerative
    diseases, mood and anxiety disorders and respiratory illnesses.

    Benchmarking and validation of existing voice-biomarker algorithms by testing
    their performance on a clinically diverse, multi-site cohort with standardized
    tasks and rich phenotype data.

    Exploratory research on acoustic, phonetic, prosodic and articulatory correlates
    of disease using de-identified derived features, including work on representation
    learning, domain adaptation and multimodal integration with other health data.

    Methodological research on fairness, robustness and AI safety in clinical voice
    models, including studies of bias related to demographic subgroups or recording
    conditions, subject to the ethical constraints in the data use agreement.

    The dataset is explicitly not intended for operational decision making about specific
    individuals such as hiring, insurance pricing, law enforcement or surveillance,
    nor for attempts at re-identification or for uses likely to stigmatize individuals
    or groups.'

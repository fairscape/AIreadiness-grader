raw_data_sources:
- description: The original raw data consist of high-quality voice, speech and respiratory
    audio waveforms recorded on tablet or smartphone devices with headset microphones
    when available, plus responses to structured demographic and medical history questionnaires,
    disease-specific validated questionnaires and other patient-reported outcomes,
    together with clinical diagnoses and other metadata extracted from electronic
    health records. The public feature-only PhysioNet release contains de-identified
    derived representations of the audio, such as spectrograms, mel spectrograms,
    MFCCs, articulatory and prosodic features and phonetic posteriorgrams, along with
    tabular phenotype files and data dictionaries; access to the underlying raw audio
    is available only through a separate controlled-access process.

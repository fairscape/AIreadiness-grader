known_biases:
- description: 'Sampling bias: participants are recruited from specialty clinics and
    associated institutions using a non-probability sampling strategy, with inclusion
    focused on specific disease cohorts and fluent English speakers; this produces
    clinically enriched case mixes that may not represent general population distributions.

    Geographic and cultural bias: data are collected at a limited number of North
    American sites, and although the project seeks diversity, it may under-represent
    speakers from other regions, cultures, languages and healthcare systems; early
    releases focus on English, with Spanish protocols planned but not yet fully represented.

    Clinical spectrum bias: because participants are selected into disease cohorts
    where voice changes are expected, the prevalence and severity of conditions in
    the dataset differ from those in routine primary care or community settings, which
    may inflate model performance when evaluated within this dataset.

    Device and environment bias: recordings are made using standardized but not identical
    hardware and primarily in clinical environments; future at-home collection or
    deployment on other devices may encounter different background noise, channel
    characteristics and user behavior.

    Algorithmic bias in machine annotations: transcripts and some derived features
    rely on off-the-shelf models such as OpenAI Whisper and other audio toolkits whose
    performance may vary across demographic groups; the dataset team has not independently
    audited these tools for fairness, so downstream users should consider their biases
    when interpreting results.'
known_limitations:
- description: "The feature-only release does not include raw audio waveforms or free-speech\
    \ transcripts, which limits certain types of modeling and error analysis and may\
    \ constrain the ability to reproduce end-to-end audio pipelines.\nThis version\
    \ only includes an adult cohort; models trained solely on this dataset may not\
    \ generalize to younger age groups or to languages beyond those represented.\n\
    Because of de-identification, some granular demographic and socio-economic variables,\
    \ fine-grained location data and narrative context have been removed, which reduces\
    \ the risk of re-identification but also limits detailed fairness assessments\
    \ and certain confounder adjustments.\nThe dataset does not provide predefined\
    \ train\u2013validation\u2013test splits or benchmarking tasks and does not include\
    \ explicit per-instance label-uncertainty measures, so researchers must design\
    \ their own evaluation protocols and handle label noise and missingness.\nThe\
    \ registered-access and controlled-access governance structure is appropriate\
    \ for privacy but may limit participation by some institutions or researchers\
    \ and can complicate the reproducibility of pipelines that require both features\
    \ and raw audio."

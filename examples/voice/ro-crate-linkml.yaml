machine_annotation_tools:
- description: OpenSMILE for extraction of acoustic feature sets capturing temporal
    dynamics and spectral characteristics.
- description: Praat and the parselmouth interface for phonetic and prosodic feature
    extraction, including measures of fundamental frequency, formants and voice quality.
- description: TorchAudio-based pipelines for computing spectrograms, mel spectrograms,
    MFCCs and pitch tracks.
- description: Speech Articulatory Coding (sparc) package for estimating articulatory
    kinematics and related features.
- description: Phonetic posteriorgram models that produce time-varying distributions
    over phonetic units for each recording.
- description: OpenAI Whisper Large for automatic speech transcription of structured
    speech tasks, with transcripts from free-speech audio removed before release.
- description: The open-source b2aiprep library for orchestrating preprocessing, feature
    extraction and merging of phenotype data into the released files.
missing_data_documentation:
- description: Phenotype tables include a row for a participant only when at least
    one variable is non-missing, and participants may have repeated visits with differing
    responses. Questionnaire completion varies by participant and cohort, so some
    forms and items are systematically or sporadically missing. Some derived audio
    features could not be computed for all recordings due to quality or length constraints,
    and features relating to free speech or sensitive records have been removed. No
    additional imputation is applied in the released files.
name: 'B2AI Voice: An ethically-sourced, diverse voice dataset linked to health information'
preprocessing_strategies:
- description: Raw audio waveforms are converted to mono and resampled to 16 kHz using
    anti-aliasing filtering; they are then segmented by task and passed through quality
    checks.
- description: From the standardized audio, multiple derived feature sets are computed
    including spectrograms, mel spectrograms, MFCCs, articulatory features using the
    Speech Articulatory Coding package, pitch and loudness estimates, acoustic features
    from openSMILE, phonetic and prosodic features from Praat and parselmouth, and
    phonetic posteriorgrams using a dedicated model; all are stored as dense tensors
    in Parquet files with participant, session and task identifiers.
- description: Tabular phenotype and questionnaire files are exported from REDCap
    and merged using a dedicated open-source b2aiprep library, reorganizing the former
    single phenotype table into thematically organized TSV files with accompanying
    JSON data dictionaries; static per-recording feature summaries are provided in
    static_features.tsv, and de-identification and filtering steps are applied before
    packaging.

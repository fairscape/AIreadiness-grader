missing_data_documentation:
- description: Yes, not all modalities are available for all participants. Some participants
    elected not to participate in some study elements. In a few cases, the data collection
    device did not have any stored results or was returned too late to retrieve the
    results (e.g. battery died, data was lost). In a few cases, there may have been
    a data collision at some point in the process and data has been lost.
name: Flagship Dataset of Type 2 Diabetes from the AI-READI Project
preprocessing_strategies:
- description: "\nThere were several quality control measures used at the time of\
    \ data entry/acquisition. For example, clinical data outside of expected min/max\
    \ ranges were flagged in REDCap, which was visible in reports viewed by clinical\
    \ research coordinators (CRCs) and Data Managers. Using these REDCap reports as\
    \ guides, Data Managers and CRCs examined participant records and determined if\
    \ an error was likely. Data were checked for the following and edited if errors\
    \ were detected:\n\n\ti. Credibility, based on range checks to determine if all\
    \ responses fall within a prespecified reasonable range\n ii. Incorrect flow through\
    \ prescribed skip patterns\n\tiii. Missing data that can be directly filed from\
    \ other portions of an individual\uFFFD s record\n\tiv. The omission and/or duplication\
    \ of records\n\nEditing was only done under the guidance and approval of the site\
    \ PI. If corrected data was available from elsewhere in the respondent\uFFFDs\
    \ answers, the error was corrected. If there was no logical or appropriate way\
    \ to correct the data, the Data site PI reviewed the values and made decisions\
    \ about whether those values should be removed from the data.\n\nOnce data +were\
    \ sent from each of the study sites to the central project team, additional processing\
    \ steps were conducted in preparation for dissemination. For example, all data\
    \ were mapped to standardized terminologies when possible, such as the Observational\
    \ Medical Outcomes Partnership (OMOP) Common Data Model, a common data model for\
    \ observational health data, and the Digital Imaging and Communications in Medicine\
    \ (DICOM), a commonly used standard for medical imaging data. Details about the\
    \ data processing approaches for each data domain/modality are described in the\
    \ dataset documentation at https://docs.aireadi.org.\n"

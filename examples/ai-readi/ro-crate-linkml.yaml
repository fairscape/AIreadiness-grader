collection_mechanisms:
- description: Multiple modalities of data are collected for each participant, including
    survey data, clinical data, retinal imaging data, environmental sensor data, continuous
    glucose monitor data, and wearable activity monitor data. These encompass tabular
    data, imaging data, and physiological signal/waveform data. There is no unstructured
    text data included in this dataset. The exact forms used for data collection in
    REDCap are available here. Furthermore, all modalities, file formats, and devices
    are detailed in the dataset documentation at https://docs.aireadi.org/.

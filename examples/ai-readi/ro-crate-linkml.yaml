known_biases:
- description: '

    Uniform data collection protocols were implemented for all subjects, irrespective
    of their race/ethnicity, biological sex, or diabetes severity, across all study
    sites. The selection of study sites was intended to ensure varied representation
    and minimize the potential for sampling bias.

    '
known_limitations:
- description: '

    While the AI-READI''s cross-sectional database ultimately aims to achieve balance
    across race/ethnicity, biological sex, and diabetes presence and severity, the
    pilot study is not balanced across these parameters.


    Three recording sites were strategically selected to achieve broad recruitment:
    the University of Alabama at Birmingham (UAB), the University of California San
    Diego (UCSD), and the University of Washington (UW). The sites were chosen for
    geographic variability across the United States and to ensure representation across
    various racial and ethnic groups. Individuals from all demographic backgrounds
    were recruited at all 3 sites. Factors influencing the generalization of derived
    models include the predominantly urban and hospital-based recruitment, which may
    not fully capture all possible cultural and socioeconomic backgrounds. The study
    cohort may not provide a comprehensive representation of the population, as it
    does not include other races/ethnicities such as Pacific Islanders and Native
    Americans. Information on device make and model, including specific modalities
    like macula scans or wide scans during OCT, were documented to ensure repeatability.
    Moreover, the study included multiple devices for one measure to enhance generalizability
    and represent the broad range of equipment utilized in clinical settings.


    In cases of survey data, skipped questions or incomplete responses are expected.
    In cases of using wearables, improper use, technical failure such as battery failure
    or system malfunction are expected. In cases of imaging data, patient uncooperation,
    noise that may obscure the images and technical failure such as system malfunction,
    and data transfer failures are expected.

    '
